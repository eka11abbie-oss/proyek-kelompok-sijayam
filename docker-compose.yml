version: '3.8'

services:
  backend-sijayam:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Menggunakan konfigurasi terbaru dari rekan tim Anda
      - ./logs:/app/writable/logs
    
  frontend-sijayam:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    env_file:
      - .env